name: Deploy to Netcup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run"
        type: boolean
        default: true

concurrency:
  group: deploy-netcup
  cancel-in-progress: false

permissions: {}

env:
  SSH_HOST: ${{ secrets.NETCUP_SSH_HOST }}
  SSH_USER: ${{ secrets.NETCUP_SSH_USER }}
  REMOTE_PATH: ${{ vars.NETCUP_REMOTE_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: netcup-das-co-kreative-netzwerk
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Set up SSH
        env:
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
        run: |
          : "${SSH_HOST:?secret NETCUP_SSH_HOST is not configured}" \
            "${SSH_USER:?secret NETCUP_SSH_USER is not configured}" \
            "${REMOTE_PATH:?variable NETCUP_REMOTE_PATH is not configured}" \
            "${NETCUP_SSH_KEY:?secret NETCUP_SSH_KEY is not configured}"
          
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$NETCUP_SSH_KEY" > "$HOME/.ssh/id_netcup"
          chmod 600 "$HOME/.ssh/id_netcup"
          
          ssh-keyscan "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          [ -s "$HOME/.ssh/known_hosts" ] || { echo "::error::ssh-keyscan found no host key for $SSH_HOST"; exit 1; }
          
          cat > "$HOME/.ssh/config" <<EOF
          Host netcup
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_netcup
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
          
          chmod 600 "$HOME/.ssh/config"

      - name: Report Grav core state (dry run)
        if: ${{ inputs.dry_run == true }}
        run: |
          if ssh netcup "test -f '$REMOTE_PATH/system/defines.php'"; then
            echo "Dry run: Grav core present (a real run would run gpm selfupgrade)"
          else
            echo "Dry run: no Grav core (a real run would install the latest grav-admin)"
          fi

      - name: Provision Grav core on Netcup (latest grav-admin)
        if: ${{ inputs.dry_run != true }}
        run: |
          ssh netcup "mkdir -p ~/.grav-deploy"
          scp provision-grav.sh netcup:.grav-deploy/
          ssh netcup "REMOTE_PATH='$REMOTE_PATH' bash ~/.grav-deploy/provision-grav.sh"

      - name: Sync user/ to Netcup (rclone over SFTP)
        env:
          RCLONE_CONFIG_NETCUP_TYPE: sftp
          RCLONE_CONFIG_NETCUP_HOST: ${{ env.SSH_HOST }}
          RCLONE_CONFIG_NETCUP_USER: ${{ env.SSH_USER }}
          RCLONE_CONFIG_NETCUP_KEY_FILE: ~/.ssh/id_netcup
          RCLONE_CONFIG_NETCUP_KNOWN_HOSTS_FILE: ~/.ssh/known_hosts
          RCLONE_CONFIG_NETCUP_SHELL_TYPE: none
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          OPTS=(-v --stats-one-line --transfers 8 --sftp-chunk-size 255k)
          if [ "$DRY_RUN" = "true" ]; then OPTS+=(--dry-run); fi
          rclone sync ./user/ "NETCUP:${REMOTE_PATH}/user/" --filter-from .rclonefilter "${OPTS[@]}"
          rclone copy ./user/config/plugins/ "NETCUP:${REMOTE_PATH}/user/config/plugins/" "${OPTS[@]}"

      - name: Install plugins and dependencies on Netcup
        if: ${{ inputs.dry_run != true }}
        run: |
          scp provision-plugins.sh netcup:.grav-deploy/
          ssh netcup "export PATH=\$HOME/.grav-deploy/bin:\$PATH GRAV_ROOT='$REMOTE_PATH'; bash ~/.grav-deploy/provision-plugins.sh"

      - name: Ensure Grav admin account on Netcup
        if: ${{ inputs.dry_run != true }}
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          : "${ADMIN_USERNAME:?secret ADMIN_USERNAME is not configured}" \
            "${ADMIN_PASSWORD:?secret ADMIN_PASSWORD is not configured}" \
            "${ADMIN_EMAIL:?secret ADMIN_EMAIL is not configured}"
          scp provision-admin.sh netcup:.grav-deploy/
          printf '%s\n%s\n%s\n' "$ADMIN_USERNAME" "$ADMIN_PASSWORD" "$ADMIN_EMAIL" \
            | ssh netcup "GRAV_ROOT='$REMOTE_PATH' bash ~/.grav-deploy/provision-admin.sh"

      - name: Provision plugin secrets on Netcup
        if: ${{ inputs.dry_run != true }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_DEFAULT_LIST_ID: ${{ secrets.BREVO_DEFAULT_LIST_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_ENCRYPTION: ${{ secrets.SMTP_ENCRYPTION }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
        run: |
          scp provision-secrets.sh netcup:.grav-deploy/
          {
            printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY"
            printf 'BREVO_DEFAULT_LIST_ID=%s\n' "$BREVO_DEFAULT_LIST_ID"
            printf 'SMTP_SERVER=%s\n' "$SMTP_SERVER"
            printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
            printf 'SMTP_ENCRYPTION=%s\n' "$SMTP_ENCRYPTION"
            printf 'SMTP_USERNAME=%s\n' "$SMTP_USERNAME"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'SMTP_FROM_EMAIL=%s\n' "$SMTP_FROM_EMAIL"
            if [ -n "$SMTP_FROM_NAME" ]; then printf 'SMTP_FROM_NAME=%s\n' "$SMTP_FROM_NAME"; fi
            # Option 1 (Trusted Host for Email Links): pin absolute URLs to the
            # canonical host — derived from the deploy target path's domain.
            printf 'CUSTOM_BASE_URL=%s\n' "https://${REMOTE_PATH##*/}"
          } | ssh netcup "GRAV_ROOT='$REMOTE_PATH' bash ~/.grav-deploy/provision-secrets.sh"
