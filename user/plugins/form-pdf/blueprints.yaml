slug: form-pdf
type: plugin
version: 1.0.0
name: Form PDF
description: Renders form submissions as PDF email attachments (page header/footer, belege merge) and attaches the signature image
icon: signature
author:
  name: DckN
homepage: https://dckn.de
keywords: signature, form, email, attachment
dependencies:
  - form
  - email

form:
  fields:
    enabled:
      type: toggle
      label: Plugin status
      highlight: 1
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool
